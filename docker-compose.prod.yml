services:
  backend:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    volumes: []
    restart: always

  frontend:
    restart: always

  mysql:
    ports: []
    restart: always

  redis:
    ports: []
    restart: always

  nginx:
    restart: always

  payment-reconcile-cron:
    image: alpine:3.20
    restart: always
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
      PAYMENT_RECONCILE_TOKEN: ${PAYMENT_RECONCILE_TOKEN}
    command: >
      sh -c "apk add --no-cache curl &&
             while true; do
               sleep 600 &&
               curl -sS -X POST
                 -H \"Authorization: Bearer $$PAYMENT_RECONCILE_TOKEN\"
                 -H \"Content-Type: application/json\"
                 -d '{\"older_than_minutes\":30,\"limit\":100}'
                 $$BACKEND_URL/api/v1/payments/admin/reconcile-pending;
             done"
