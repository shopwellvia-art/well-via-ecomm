services:
  frontend:
    # Replace (not append to) the base ports list so the conflicting 5173 is dropped.
    ports: !override
      - "5174:80"
  mysql:
    # Host 3306 is held by another project's container; backend still reaches
    # mysql:3306 over the compose network. Host tools (check_db.py) must set
    # MYSQL_PORT=3307.
    ports: !override
      - "3307:3306"
