<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2874F0" />
    <meta name="description" content="Shop the latest deals — electronics, fashion, home & more." />
    <title>Lumen — Online Shopping</title>
    <!-- Storefront is light-only (Flipkart look). Force light before paint so a
         stale 'dark' preference can never flash the old theme. -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add('light');
          root.style.colorScheme = 'light';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
