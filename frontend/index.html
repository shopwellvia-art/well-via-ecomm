<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2874F0" />
    <meta name="description" content="Shop the latest deals — electronics, fashion, home & more." />
    <title>Lumen — Online Shopping</title>
    <!-- Storefront is light-only (Flipkart look). Force light before paint so a
         stale 'dark' preference can never flash the old theme. Externalized to
         a self-hosted file to satisfy the production CSP (script-src 'self'). -->
    <script src="/theme-init.js"></script>
    <!-- Roboto is self-hosted via @fontsource/roboto (imported in main.jsx) so
         it loads under the strict CSP without a Google Fonts exception. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
