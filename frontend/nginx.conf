upstream backend_upstream {
    server backend:8000;
}

server {
    listen 80;
    # Also bind IPv6 loopback/any so probes that resolve localhost to ::1 work.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version from response headers.
    server_tokens off;

    # Security response headers — applied to every response from this server block.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # ---- Analytics tracking: CSP rollout, STAGE 1 of 2 -----------------------
    # The ENFORCED policy above is deliberately unchanged. This is the candidate
    # policy running in REPORT-ONLY alongside it: browsers evaluate it, report
    # what it would have blocked, and block nothing. Nothing here can break the
    # site — that is the entire point of shipping it first.
    #
    # Why not just add the domains to the enforced policy: the candidate list
    # below is a HYPOTHESIS. Google and Microsoft both serve tags from hosts
    # that are not fully documented and that change; a missed host in an enforced
    # policy fails only in production, only for real customers, and typically
    # only on the checkout page where the money is. Report-Only turns that into
    # a log line.
    #
    # STAGE 2 — do NOT perform until all of these hold:
    #   1. ANALYTICS_TRACKING_ENABLED has been on in staging AND production long
    #      enough to exercise: storefront browsing, PDP, cart, the full checkout,
    #      the payment redirect AND return, /media/ image loads, and the Leaflet
    #      map on the geo view.
    #   2. The report endpoint shows a clean window with tags actually firing —
    #      zero reports because tracking was off proves nothing.
    #   3. Every host in the enforced list is one the reports PROVED necessary.
    #      Do not promote a host from this comment because it looks plausible.
    # Then: copy the tested directives into the enforced header, in BOTH places
    # (here and the `= /index.html` block — `add_header` does not inherit).
    #
    # Deliberately absent: 'unsafe-inline' on script-src. The GTM bootstrap is
    # bundled by Vite (frontend/src/features/tracking/gtm.js) rather than pasted
    # inline, precisely so this policy never needs it. GTM **Custom HTML tags are
    # forbidden** in the container as an operating rule — one would reintroduce
    # the requirement and undo this.
    #
    # c.bing.com is on the list because Microsoft Clarity ingests through it.
    # It looks wrong in a storefront CSP and is correct; that is exactly the kind
    # of host a hand-written policy misses.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' https://www.googletagmanager.com https://www.clarity.ms; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://*.clarity.ms https://c.bing.com; frame-src https://www.googletagmanager.com; object-src 'none'; frame-ancestors 'none'; report-uri /api/v1/analytics/csp-report" always;
    # HSTS — uncomment once TLS terminates at this nginx (do NOT enable on plain HTTP):
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Allow image/logo uploads (matches the API's MAX_IMAGE_SIZE_MB headroom).
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /media/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Product images are content-addressed by uuid and effectively immutable,
        # so let browsers/CDNs cache them instead of re-hitting the app on every
        # product view.
        expires 7d;
        add_header Cache-Control "public" always;
        # Harden user-upload responses: prevent stored HTML/SVG from executing
        # as same-origin script.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Content-Disposition "inline" always;
    }

    location /docs {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Build stamps & SPA cache policy ------------------------------------
    # /version.json is baked into the image at build time (frontend/Dockerfile).
    # Never cache it, so a deploy check always sees the LIVE commit:
    #   curl http://localhost:8090/version.json
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Backend build stamp, proxied so the API's live commit is verifiable too:
    #   curl http://localhost:8090/version
    location = /version {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Backend probes, proxied so external monitoring can reach them. /ready is
    # the readiness check (verifies MySQL + Redis connectivity); /health is the
    # cheap liveness check.
    location = /health {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # The SPA shell must revalidate on every load. Otherwise a browser can keep a
    # cached index.html that points at old, since-replaced asset hashes, so the
    # UI looks "not updated" even after a good deploy. (Hashed files under
    # /assets/ stay immutable — only the shell is no-cache.) An add_header here
    # overrides inheritance, so the server-level security headers are repeated
    # to avoid silently dropping them on the most important response.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
        # Repeated here because `add_header` in a location REPLACES the inherited
        # set rather than adding to it — the server-level headers above do not
        # reach this block. index.html is the document every tag actually loads
        # into, so omitting the Report-Only policy here would mean collecting
        # reports from nowhere and reading the silence as a clean window.
        # Keep byte-identical to the server-level copy.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' https://www.googletagmanager.com https://www.clarity.ms; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://*.clarity.ms https://c.bing.com; frame-src https://www.googletagmanager.com; object-src 'none'; frame-ancestors 'none'; report-uri /api/v1/analytics/csp-report" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
