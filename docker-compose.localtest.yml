# LOCAL THROWAWAY overlay — for a disposable mysql+redis+backend stack only.
#
# Usage (ALWAYS with -p wellvia-rzptest and ALL THREE -f flags, so the
# auto-applied docker-compose.override.yml is bypassed and the already-running
# "well-via-ecomm" compose project is never touched):
#
#   docker compose -p wellvia-rzptest \
#     -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.localtest.yml \
#     up -d --build mysql redis backend
#
# SAFETY: this overlay exists to guarantee the backend can NEVER see the real
# backend/.env (which points at the shared remote MySQL 13.204.184.41):
#   1. env_file is REPLACED (!override) with backend/.env.localtest.
#   2. The ./backend:/app bind mount is REMOVED — with the mount, the real
#      backend/.env would appear at /app/.env inside the container, where
#      pydantic-settings (env_file=".env") reads any key not set in the
#      environment. The image already contains the app code (COPY . . in
#      backend/Dockerfile; .dockerignore excludes .env and .env.*).
#   3. The DB/redis-pointing keys are ALSO pinned under environment:, which
#      always beats env_file, as defence in depth.
services:
  backend:
    restart: "no"
    env_file: !override
      - ./backend/.env.localtest
    environment:
      ENVIRONMENT: development
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ecom
      MYSQL_PASSWORD: ecom_password
      MYSQL_DB: ecommerce
      REDIS_URL: redis://redis:6379/0
    volumes: !override []
    # Host 8000 is taken by the running well-via-ecomm stack — publish on 18000.
    ports: !override
      - "18000:8000"

  redis:
    restart: "no"
    # Host 6379 is taken by the running well-via-ecomm stack; the backend
    # reaches redis over the compose network, so publish nothing.
    ports: !override []
