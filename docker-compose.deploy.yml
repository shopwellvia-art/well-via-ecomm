# Production deployment compose — runs on the EC2 host.
#
# Images are built and pushed to GHCR by the GitHub Actions pipeline
# (.github/workflows/deploy.yml); the EC2 only *pulls* them. The frontend
# image bundles nginx and serves the SPA while reverse-proxying /api, /media
# and /docs to the backend. It listens on container port 80, published on the
# host as 8090 (Omvedha nginx owns :80/:443 and the LAMP stack owns :8080).
#
# The database is EXTERNAL (the shared remote MySQL) — configured entirely
# through backend/.env on the host. There is intentionally no mysql service
# here, and NO `alembic upgrade head` is ever run against it: that DB is on a
# migration lineage this repo does not contain, so schema changes are applied
# MANUALLY from reviewed SQL only.
#
# Usage on the EC2 (the CI does this for you):
#   IMAGE_TAG=<git-sha> docker compose -f docker-compose.deploy.yml pull
#   IMAGE_TAG=<git-sha> docker compose -f docker-compose.deploy.yml up -d

services:
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Cap container logs so a chatty/looping service can't fill the shared EC2
    # disk (default json-file driver has no rotation).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Shared host — bound memory so one container can't starve the others.
    mem_limit: 256m

  backend:
    image: ghcr.io/shopwellvia-art/simple-com-backend:${IMAGE_TAG:-latest}
    restart: always
    env_file: ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Persists uploaded images (logos, hero/product images) across deploys
      # when STORAGE_BACKEND=local. Not needed if you switch to S3.
      - backend_uploads:/app/uploads
    # No public ports — the frontend/nginx container fronts it.
    expose:
      - "8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 4 uvicorn workers (Dockerfile) + the 20m upload path + reportlab PDF
    # generation need headroom; 512m risked OOM-kills under restart: always.
    mem_limit: 1g

  frontend:
    image: ghcr.io/shopwellvia-art/simple-com-frontend:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      - backend
    ports:
      # Omvedha nginx owns :80/:443 and the LAMP stack owns :8080 on this host;
      # well-via is published on :8090.
      - "8090:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128m

  # Payment-reconcile sidecar. PhonePe's S2S webhook can be missed (user closes
  # the tab, transient network) leaving orders stuck "pending"; this loop nudges
  # the backend to reconcile them against the gateway every ~10 minutes. It
  # authenticates with the machine-auth header X-Reconcile-Token (NOT a Bearer
  # JWT) so there is no short-lived human token to expire.
  payment-reconcile-cron:
    image: curlimages/curl:8.11.1
    restart: always
    depends_on:
      - backend
    # Same env file as the backend, so PAYMENT_RECONCILE_TOKEN is guaranteed to
    # match the value the API checks (single source of truth). The container
    # shell reads it from its own environment — $$ escapes compose interpolation
    # so the value is expanded at runtime, not baked into the compose file.
    env_file: ./backend/.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -X POST \
            -H "X-Reconcile-Token: $${PAYMENT_RECONCILE_TOKEN}" \
            http://backend:8000/api/v1/payments/admin/reconcile-pending \
            || echo "reconcile POST failed; will retry next cycle";
          sleep 600;
        done
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 64m

volumes:
  redis_data:
  backend_uploads:
