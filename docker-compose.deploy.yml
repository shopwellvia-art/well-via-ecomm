# Production deployment compose — runs on the EC2 host.
#
# Images are built and pushed to GHCR by the GitHub Actions pipeline
# (.github/workflows/deploy.yml); the EC2 only *pulls* them. The frontend
# image bundles nginx and serves the SPA while reverse-proxying /api, /media
# and /docs to the backend, so it is the public entrypoint on port 80.
#
# The database is EXTERNAL (your existing MySQL) — configured entirely through
# backend/.env on the host. There is intentionally no mysql service here.
#
# Usage on the EC2 (the CI does this for you):
#   IMAGE_TAG=<git-sha> docker compose -f docker-compose.deploy.yml pull
#   IMAGE_TAG=<git-sha> docker compose -f docker-compose.deploy.yml up -d
#   docker compose -f docker-compose.deploy.yml exec -T backend alembic upgrade head

services:
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/shopwellvia-art/simple-com-backend:${IMAGE_TAG:-latest}
    restart: always
    env_file: ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Persists uploaded images (logos, hero/product images) across deploys
      # when STORAGE_BACKEND=local. Not needed if you switch to S3.
      - backend_uploads:/app/uploads
    # No public ports — the frontend/nginx container fronts it.
    expose:
      - "8000"

  frontend:
    image: ghcr.io/shopwellvia-art/simple-com-frontend:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      - backend
    ports:
      # pg_360 owns :80 on this host; simple-com is published on :8080.
      - "8080:80"

volumes:
  redis_data:
  backend_uploads:
