<!doctype html>
<html lang="en" class="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ShopWell — Cart</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,400;1,500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/config.js"></script>
<link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
  <div data-header></div>

  <main class="mx-auto max-w-content px-4 py-4 sm:px-6">
    <div class="grid grid-cols-1 gap-3 lg:grid-cols-[1fr_360px]">
      <!-- ── Items ──────────────────────────────────────────────────── -->
      <section class="overflow-hidden rounded-lg bg-bg-elevated shadow-sm">
        <div class="flex items-center justify-between border-b border-line-subtle px-5 py-4">
          <h1 class="text-lg font-bold text-ink-primary">My Cart (<span data-n>3</span>)</h1>
          <span class="text-sm text-ink-tertiary">Deliver to <b class="font-semibold text-ink-secondary">Bengaluru 560103</b></span>
        </div>
        <div data-items class="divide-y divide-line-subtle"></div>
      </section>

      <!-- ── Summary ────────────────────────────────────────────────── -->
      <aside class="lg:sticky lg:top-[120px] lg:self-start">
        <div class="overflow-hidden rounded-lg bg-bg-elevated shadow-sm">
          <h2 class="border-b border-line-subtle px-5 py-3.5 text-xs font-bold uppercase tracking-wide text-ink-tertiary">Price details</h2>
          <div class="space-y-3 px-5 py-4 text-sm">
            <div class="flex justify-between"><span class="text-ink-secondary">Price (<span data-n2>3</span> items)</span><span class="nums text-ink-primary" data-gross></span></div>
            <div class="flex justify-between"><span class="text-ink-secondary">Discount</span><span class="nums font-medium text-rating" data-disc></span></div>
            <div class="flex justify-between"><span class="text-ink-secondary">Delivery charges</span><span class="font-medium text-rating">FREE</span></div>
            <div class="flex justify-between border-t border-dashed border-line-strong pt-3 text-base font-bold text-ink-primary"><span>Total amount</span><span class="nums" data-total></span></div>
          </div>
          <div class="border-t border-dashed border-line-subtle px-5 py-3">
            <p class="text-sm font-semibold text-rating" data-savings></p>
          </div>
          <div class="px-5 pb-5">
            <button onclick="SW.toast('Order placed — thank you!')" class="flex h-12 w-full items-center justify-center gap-2 rounded-lg bg-cta text-sm font-bold uppercase tracking-wide text-white shadow-sm transition-transform hover:-translate-y-0.5 active:translate-y-0">Place order</button>
          </div>
        </div>
        <div class="mt-3 flex items-center gap-2.5 rounded-lg bg-bg-elevated px-5 py-3.5 text-sm text-ink-secondary shadow-sm">
          <span class="text-rating"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></span>
          Safe and secure payments. Easy returns. 100% authentic products.
        </div>
      </aside>
    </div>
  </main>

  <div data-footer></div>

  <script src="assets/data.js"></script>
  <script src="assets/chrome.js"></script>
  <script>
    document.querySelector('[data-header]').innerHTML = SWChrome.header('');
    document.querySelector('[data-footer]').innerHTML = SWChrome.footer();

    let cart = SW.pick(['orbit-phone','aura-headphones','lumen-watch']).map((p)=>({p, qty:1}));

    function row(item, i) {
      const { p, qty } = item;
      return `<div class="flex gap-4 p-5">
        <a href="ShopWell Product.html?id=${p.id}" class="size-24 shrink-0 overflow-hidden rounded-lg border border-line-subtle sm:size-28">${SW.thumb(p)}</a>
        <div class="min-w-0 flex-1">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <p class="text-xs font-semibold uppercase tracking-wide text-ink-tertiary">${p.brand}</p>
              <a href="ShopWell Product.html?id=${p.id}" class="line-clamp-1 text-sm font-medium text-ink-primary hover:text-accent">${p.name}</a>
              <p class="mt-0.5 text-xs text-ink-tertiary">Seller: ShopWell Retail</p>
            </div>
            <span class="rating-pill shrink-0">${SW.stars(p.rating)}</span>
          </div>
          <div class="mt-2 flex items-baseline gap-2">
            <span class="text-lg font-bold text-ink-primary">${SW.inr(p.price)}</span>
            ${p.off?`<span class="text-sm text-ink-tertiary line-through">${SW.inr(p.mrp)}</span><span class="text-sm font-semibold text-rating">${p.off}% off</span>`:''}
          </div>
          <div class="mt-3 flex items-center gap-5">
            <div class="inline-flex items-center rounded-lg border border-line-strong">
              <button data-dec="${i}" class="grid size-8 place-items-center text-ink-secondary hover:text-accent">−</button>
              <span class="w-9 text-center text-sm font-semibold nums">${qty}</span>
              <button data-inc="${i}" class="grid size-8 place-items-center text-ink-secondary hover:text-accent">+</button>
            </div>
            <button data-save="${i}" class="text-sm font-semibold text-ink-secondary hover:text-accent">Save for later</button>
            <button data-rm="${i}" class="text-sm font-semibold text-ink-secondary hover:text-danger">Remove</button>
          </div>
        </div>
      </div>`;
    }

    function render() {
      const wrap = document.querySelector('[data-items]');
      if (!cart.length) { wrap.innerHTML = `<div class="px-5 py-16 text-center text-ink-tertiary">Your cart is empty. <a href="ShopWell Products.html" class="font-semibold text-accent hover:underline">Continue shopping ›</a></div>`; }
      else wrap.innerHTML = cart.map(row).join('');
      const n = cart.reduce((s,i)=>s+i.qty,0);
      const gross = cart.reduce((s,i)=>s+i.p.mrp*i.qty,0);
      const net = cart.reduce((s,i)=>s+i.p.price*i.qty,0);
      const disc = gross-net;
      document.querySelectorAll('[data-n],[data-n2]').forEach(e=>e.textContent=n);
      document.querySelector('[data-gross]').textContent=SW.inr(gross);
      document.querySelector('[data-disc]').textContent='− '+SW.inr(disc);
      document.querySelector('[data-total]').textContent=SW.inr(net);
      document.querySelector('[data-savings]').textContent='You save '+SW.inr(disc)+' on this order';
    }

    document.querySelector('[data-items]').addEventListener('click',(e)=>{
      const inc=e.target.closest('[data-inc]'), dec=e.target.closest('[data-dec]'), rm=e.target.closest('[data-rm]'), sv=e.target.closest('[data-save]');
      if(inc){cart[+inc.dataset.inc].qty++;render();}
      else if(dec){const it=cart[+dec.dataset.dec];it.qty=Math.max(1,it.qty-1);render();}
      else if(rm){cart.splice(+rm.dataset.rm,1);render();SW.toast('Removed from cart');}
      else if(sv){SW.toast('Saved for later');}
    });

    render();
    SW.init();
  </script>
  <style id="__om-edit-overrides"></style>
</body>
</html>
