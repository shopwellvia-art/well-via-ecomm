<!doctype html>
<html lang="en" class="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ShopWell — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,400;1,500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/config.js"></script>
<link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
  <div data-header></div>

  <main class="grid min-h-[calc(100vh-200px)] place-items-center px-4 py-10">
    <div class="grid w-full max-w-3xl grid-cols-1 overflow-hidden rounded-xl bg-bg-elevated shadow-lg sm:grid-cols-[40%_1fr]">
      <!-- Left brand panel -->
      <div class="flex flex-col justify-between gap-8 p-8" style="background:linear-gradient(160deg,#1f63d6,#2874F0)">
        <div>
          <h2 class="text-2xl font-bold leading-tight text-white">Login</h2>
          <p class="mt-3 text-sm leading-relaxed text-white/85">Get access to your orders, wishlist and personalised recommendations.</p>
        </div>
        <ul class="space-y-3 text-sm text-white/90">
          <li class="flex items-center gap-2.5"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#FFE11B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Faster checkout</li>
          <li class="flex items-center gap-2.5"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#FFE11B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Order tracking</li>
          <li class="flex items-center gap-2.5"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#FFE11B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Exclusive member deals</li>
        </ul>
      </div>

      <!-- Right form -->
      <div class="p-8">
        <form onsubmit="event.preventDefault();window.location.href='ShopWell Home.html'" class="flex flex-col gap-4">
          <label class="block">
            <span class="text-xs font-semibold uppercase tracking-wide text-ink-tertiary">Email or mobile number</span>
            <input type="text" required placeholder="you@example.com" class="mt-1.5 h-11 w-full rounded-lg border border-line-strong bg-bg-sunken px-3.5 text-sm outline-none transition-colors focus:border-accent" />
          </label>
          <label class="block">
            <span class="text-xs font-semibold uppercase tracking-wide text-ink-tertiary">Password</span>
            <input type="password" required placeholder="••••••••" class="mt-1.5 h-11 w-full rounded-lg border border-line-strong bg-bg-sunken px-3.5 text-sm outline-none transition-colors focus:border-accent" />
          </label>
          <p class="text-[11px] leading-relaxed text-ink-tertiary">By continuing, you agree to ShopWell's <a href="#" class="text-accent hover:underline">Terms of Use</a> and <a href="#" class="text-accent hover:underline">Privacy Policy</a>.</p>
          <button class="h-11 rounded-lg bg-cta text-sm font-bold uppercase tracking-wide text-white shadow-sm transition-transform hover:-translate-y-0.5 active:translate-y-0">Login</button>
          <div class="flex items-center gap-3 text-xs text-ink-tertiary"><span class="h-px flex-1 bg-line-subtle"></span>OR<span class="h-px flex-1 bg-line-subtle"></span></div>
          <button type="button" class="h-11 rounded-lg border border-line-strong bg-bg-elevated text-sm font-semibold text-ink-primary transition-colors hover:border-accent hover:text-accent">Request OTP on email</button>
          <p class="text-center text-sm text-ink-secondary">New to ShopWell? <a href="ShopWell Home.html" class="font-semibold text-accent hover:underline">Create an account</a></p>
        </form>
      </div>
    </div>
  </main>

  <div data-footer></div>

  <script src="assets/data.js"></script>
  <script src="assets/chrome.js"></script>
  <script>
    document.querySelector('[data-header]').innerHTML = SWChrome.header('');
    document.querySelector('[data-footer]').innerHTML = SWChrome.footer();
    SW.init();
  </script>
  <style id="__om-edit-overrides"></style>
</body>
</html>
