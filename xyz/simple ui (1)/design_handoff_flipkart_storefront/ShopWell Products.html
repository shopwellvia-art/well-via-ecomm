<!doctype html>
<html lang="en" class="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ShopWell — All Products</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,400;1,500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/config.js"></script>
<link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
  <div data-header></div>

  <main class="mx-auto max-w-content px-4 py-4 sm:px-6">
    <!-- Breadcrumb -->
    <nav class="mb-3 flex items-center gap-1.5 text-xs text-ink-tertiary">
      <a href="ShopWell Home.html" class="hover:text-accent">Home</a><span>›</span>
      <a href="ShopWell Products.html" class="hover:text-accent">Electronics</a><span>›</span>
      <span class="font-medium text-ink-secondary">All Products</span>
    </nav>

    <div class="flex gap-4">
      <!-- ── Filter sidebar ─────────────────────────────────────────── -->
      <aside id="plp-filters" onclick="if(event.target===this)this.classList.add('hidden')" class="fixed inset-0 z-[80] hidden bg-black/45 lg:static lg:z-auto lg:block lg:w-64 lg:shrink-0 lg:bg-transparent">
        <div class="flex h-full w-[86%] max-w-xs flex-col overflow-y-auto bg-bg-elevated shadow-lg lg:sticky lg:top-[120px] lg:h-auto lg:w-auto lg:rounded-lg lg:shadow-sm">
          <div class="flex items-center justify-between border-b border-line-subtle px-4 py-3">
            <h2 class="text-sm font-bold uppercase tracking-wide text-ink-primary">Filters</h2>
            <button class="hidden text-xs font-semibold text-accent hover:underline lg:inline">Clear all</button>
            <button onclick="document.getElementById('plp-filters').classList.add('hidden')" aria-label="Close filters" class="grid size-7 place-items-center rounded-sm text-ink-secondary lg:hidden"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          </div>

          <div class="border-b border-line-subtle px-4 py-4">
            <h3 class="mb-2.5 text-xs font-semibold uppercase tracking-wide text-ink-tertiary">Category</h3>
            <ul class="space-y-1 text-sm" data-filter-cat></ul>
          </div>

          <div class="border-b border-line-subtle px-4 py-4">
            <h3 class="mb-2.5 text-xs font-semibold uppercase tracking-wide text-ink-tertiary">Price</h3>
            <ul class="space-y-2 text-sm text-ink-secondary">
              <li><label class="flex cursor-pointer items-center gap-2"><input type="checkbox" class="accent-accent" /> Under ₹1,000</label></li>
              <li><label class="flex cursor-pointer items-center gap-2"><input type="checkbox" class="accent-accent" /> ₹1,000 – ₹5,000</label></li>
              <li><label class="flex cursor-pointer items-center gap-2"><input type="checkbox" class="accent-accent" /> ₹5,000 – ₹20,000</label></li>
              <li><label class="flex cursor-pointer items-center gap-2"><input type="checkbox" class="accent-accent" /> Over ₹20,000</label></li>
            </ul>
          </div>

          <div class="border-b border-line-subtle px-4 py-4">
            <h3 class="mb-2.5 text-xs font-semibold uppercase tracking-wide text-ink-tertiary">Customer rating</h3>
            <ul class="space-y-2 text-sm text-ink-secondary">
              <li><label class="flex cursor-pointer items-center gap-2"><input type="checkbox" class="accent-accent" /> 4★ &amp; above</label></li>
              <li><label class="flex cursor-pointer items-center gap-2"><input type="checkbox" class="accent-accent" /> 3★ &amp; above</label></li>
            </ul>
          </div>

          <div class="px-4 py-4">
            <h3 class="mb-2.5 text-xs font-semibold uppercase tracking-wide text-ink-tertiary">Offers</h3>
            <ul class="space-y-2 text-sm text-ink-secondary">
              <li><label class="flex cursor-pointer items-center gap-2"><input type="checkbox" class="accent-accent" checked /> On sale</label></li>
              <li><label class="flex cursor-pointer items-center gap-2"><input type="checkbox" class="accent-accent" /> No-cost EMI</label></li>
              <li><label class="flex cursor-pointer items-center gap-2"><input type="checkbox" class="accent-accent" /> Free delivery</label></li>
            </ul>
          </div>
          <div class="mt-auto border-t border-line-subtle p-3 lg:hidden">
            <button onclick="document.getElementById('plp-filters').classList.add('hidden')" class="h-11 w-full rounded-lg bg-accent text-sm font-semibold uppercase tracking-wide text-white">Show results</button>
          </div>
        </div>
      </aside>

      <!-- ── Results ─────────────────────────────────────────────────── -->
      <section class="min-w-0 flex-1">
        <div class="mb-3 flex items-center gap-3 rounded-lg bg-bg-elevated px-3 py-2.5 shadow-sm sm:px-4 sm:py-3">
          <button onclick="document.getElementById('plp-filters').classList.remove('hidden')" class="inline-flex h-8 shrink-0 items-center gap-1.5 rounded-lg border border-line-strong px-3 text-sm font-semibold text-ink-primary lg:hidden">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg> Filters
          </button>
          <p class="hidden shrink-0 text-sm text-ink-secondary sm:block"><span class="font-semibold text-ink-primary">All Products</span> <span class="text-ink-tertiary">(<span data-count>20</span> results)</span></p>
          <div class="ml-auto flex min-w-0 items-center gap-1 overflow-x-auto text-sm rail">
            <span class="mr-1 hidden shrink-0 text-ink-tertiary sm:inline">Sort By</span>
            <button data-sort class="shrink-0 rounded-sm bg-accent px-3 py-1.5 font-semibold text-white">Relevance</button>
            <button data-sort class="shrink-0 rounded-sm px-3 py-1.5 font-medium text-ink-secondary hover:text-accent">Price — Low to High</button>
            <button data-sort class="shrink-0 rounded-sm px-3 py-1.5 font-medium text-ink-secondary hover:text-accent">Price — High to Low</button>
            <button data-sort class="shrink-0 rounded-sm px-3 py-1.5 font-medium text-ink-secondary hover:text-accent">Newest</button>
          </div>
        </div>

        <div data-grid class="grid grid-cols-2 gap-3 sm:grid-cols-3 xl:grid-cols-4"></div>

        <div class="mt-6 flex items-center justify-center gap-1.5">
          <button class="grid size-9 place-items-center rounded-sm border border-line-subtle bg-bg-elevated text-ink-tertiary"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
          <button class="grid size-9 place-items-center rounded-sm bg-accent font-semibold text-white">1</button>
          <button class="grid size-9 place-items-center rounded-sm border border-line-subtle bg-bg-elevated font-medium text-ink-secondary hover:border-accent hover:text-accent">2</button>
          <button class="grid size-9 place-items-center rounded-sm border border-line-subtle bg-bg-elevated font-medium text-ink-secondary hover:border-accent hover:text-accent">3</button>
          <button class="grid size-9 place-items-center rounded-sm border border-line-subtle bg-bg-elevated text-ink-secondary hover:border-accent hover:text-accent"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
      </section>
    </div>
  </main>

  <div data-footer></div>

  <script src="assets/data.js"></script>
  <script src="assets/chrome.js"></script>
  <script>
    document.querySelector('[data-header]').innerHTML = SWChrome.header('');
    document.querySelector('[data-footer]').innerHTML = SWChrome.footer();

    // Category filter list (with "All")
    const cats = ['All Categories', ...Array.from(new Set(SW.PRODUCTS.map((p) => p.cat)))];
    document.querySelector('[data-filter-cat]').innerHTML = cats.map((c, i) =>
      `<li><button data-cat="${c}" class="w-full rounded-sm px-2 py-1.5 text-left transition-colors ${i===0 ? 'bg-accent/10 font-semibold text-accent' : 'text-ink-secondary hover:bg-fill hover:text-ink-primary'}">${c}</button></li>`
    ).join('');

    const grid = document.querySelector('[data-grid]');
    function render(list) {
      grid.innerHTML = list.map(SW.gridCard).join('');
      document.querySelector('[data-count]').textContent = list.length;
    }
    render(SW.PRODUCTS);

    // Category filtering
    let activeCat = 'All Categories';
    document.querySelector('[data-filter-cat]').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-cat]'); if (!btn) return;
      activeCat = btn.dataset.cat;
      document.querySelectorAll('[data-cat]').forEach((b) => {
        const on = b === btn;
        b.className = 'w-full rounded-sm px-2 py-1.5 text-left transition-colors ' + (on ? 'bg-accent/10 font-semibold text-accent' : 'text-ink-secondary hover:bg-fill hover:text-ink-primary');
      });
      apply();
    });

    let sort = 'rel';
    document.querySelectorAll('[data-sort]').forEach((b, idx) => b.addEventListener('click', () => {
      document.querySelectorAll('[data-sort]').forEach((x) => { x.className = 'shrink-0 rounded-sm px-3 py-1.5 font-medium text-ink-secondary hover:text-accent'; });
      b.className = 'shrink-0 rounded-sm bg-accent px-3 py-1.5 font-semibold text-white';
      sort = ['rel','asc','desc','new'][idx];
      apply();
    }));

    function apply() {
      let list = activeCat === 'All Categories' ? [...SW.PRODUCTS] : SW.PRODUCTS.filter((p) => p.cat === activeCat);
      if (sort === 'asc') list.sort((a,b)=>a.price-b.price);
      if (sort === 'desc') list.sort((a,b)=>b.price-a.price);
      render(list);
    }

    SW.init();
  </script>
  <style id="__om-edit-overrides"></style>
</body>
</html>
