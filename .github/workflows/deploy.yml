name: Build & Deploy to EC2

# Push to production → the "Backend tests" workflow runs → and ONLY if it
# succeeds does this workflow build/push/deploy. The `workflow_run` trigger is
# what gates the deploy on green tests: `push` alone would ship regardless of
# whether tests passed. Every job is additionally guarded on
# `workflow_run.conclusion == 'success'`.
#
# Manual runs from the Actions tab (workflow_dispatch) deliberately bypass the
# gate, for emergency redeploys of an already-tested commit.
#
# NOTE: a `workflow_run`-triggered run uses the workflow file from the
# repository's DEFAULT branch, and `github.sha` points at that branch's head —
# so we build/tag/deploy `github.event.workflow_run.head_sha` (the commit the
# tests actually ran against) instead. On a manual run that is empty, so we fall
# back to `github.sha`.
on:
  workflow_run:
    workflows: ["Backend tests"]
    types: [completed]
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Image repositories (lowercase owner). Tags: <deploy-sha> + latest.
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/simple-com-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/simple-com-frontend
  # The commit to build & deploy — see the header note about workflow_run.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    # Deploy gate: only build/ship when the tests that triggered us passed. A
    # manual run has no workflow_run payload, so it is allowed through.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact commit the tests ran against, not the default-branch
          # head (which is what workflow_run checks out by default).
          ref: ${{ env.DEPLOY_SHA }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy on EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Ship the compose file from the exact commit we built/deployed.
          ref: ${{ env.DEPLOY_SHA }}

      # Ship the latest compose file to the host so it stays in sync.
      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.deploy.yml
          target: ${{ secrets.EC2_APP_DIR }}

      - name: Pull images and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_PAT
          script: |
            set -euo pipefail
            cd "${{ secrets.EC2_APP_DIR }}"

            # Authenticate to GHCR so private images can be pulled.
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # IMAGE_TAG is forwarded from the step env (the deployed commit SHA).
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d
            # NO automatic `alembic upgrade head` here: the shared remote MySQL
            # is at a migration lineage ('conpay001') that this repo does not
            # contain, and per the project convention (see
            # backend/alembic/versions/s0t1u2v3w4x5_*.py) schema changes are
            # applied to it manually from reviewed SQL only.
            # Reclaim space from old image layers.
            docker image prune -f
        env:
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
