# =============================================================================
#  CI/CD — the ONLY workflow in this repo.
# =============================================================================
#
#  PRODUCTION BRANCH ONLY. Nothing here runs for any other branch or for Pull
#  Requests — a push (or a merge, which is just a push) to `production` runs the
#  whole thing end to end and the live EC2 stack comes back up on the new code.
#
#      push / merge to `production`
#         ├─ frontend        (npm ci, lint, build, vitest)
#         └─ backend-tests   (mysql 8 + redis 7 services, alembic, pytest)
#                    │
#                    ▼  BOTH must be green
#              build-and-push (GHCR: :latest + :<sha>)
#                    │
#                    ▼
#                 deploy     (scp compose -> EC2, pull, recreate backend+frontend,
#                             then verify both really run the new :<sha>)
#
#  A red test run BLOCKS the deploy — including manual `workflow_dispatch` runs.
#  Schema migrations are NEVER run by this pipeline; the shared remote MySQL is
#  on a migration lineage this repo does not contain. See DEPLOY.md §6.
# =============================================================================

name: CI/CD

on:
  push:
    branches: [production]
  workflow_dispatch:

# One deploy at a time. cancel-in-progress is deliberately FALSE: killing a run
# midway through `docker compose up -d` could leave the live stack half-updated,
# so back-to-back merges queue and apply in order instead of racing.
concurrency:
  group: cicd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ===========================================================================
  #  QUALITY GATE 1 — the React/Vite app must install, lint, build and test.
  # ===========================================================================
  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Non-blocking: ESLint v9 needs a flat `eslint.config.js` that this repo
      # does not have yet, so the step currently CANNOT pass. Once that config
      # lands, delete `continue-on-error` to make lint a required check.
      - name: Lint (non-blocking — no eslint flat config yet)
        run: npm run lint
        continue-on-error: true

      # The real gate: if it doesn't build, nothing ships.
      - name: Build
        run: npm run build

      # --run             -> single pass, no watch mode.
      # --passWithNoTests -> tolerate the current zero-test state; drop this
      #                      flag once real tests exist so an empty suite can't
      #                      pass as a false green.
      - name: Unit tests (Vitest)
        run: npm test -- --run --passWithNoTests

  # ===========================================================================
  #  QUALITY GATE 2 — the backend integration suite.
  #
  #  These are real integration tests (live DB via SessionLocal + FastAPI
  #  TestClient), so they need an actual MySQL + Redis. We use GitHub Actions
  #  `services:` containers rather than a compose overlay, which is why this
  #  repo needs only ONE compose file (the production one).
  #
  #  The database here is a THROWAWAY container that is destroyed with the
  #  runner. backend/tests/conftest.py hard-fails the session unless it is
  #  pointed at a local host + a non-production ENVIRONMENT, so this can never
  #  touch the shared remote MySQL.
  # ===========================================================================
  backend-tests:
    name: Backend tests (MySQL + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8
        # Throwaway CI credentials — must match the backend/.env written below.
        # mysql:8 auto-grants this user full rights on MYSQL_DATABASE, which the
        # Alembic migrations need for DDL.
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ecommerce
          MYSQL_USER: ecom
          MYSQL_PASSWORD: ecom_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # requirements-dev.txt pulls in requirements.txt plus pytest. The DB
      # driver is PyMySQL (pure Python), so no system build deps are needed.
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      # The service's healthcheck can go green a moment before MySQL is really
      # accepting application connections. Poll with the same driver the app
      # uses so we fail fast with a clear message instead of mid-migration.
      - name: Wait for MySQL to accept connections
        run: |
          python - <<'PY'
          import sys, time
          import pymysql
          for attempt in range(1, 41):
              try:
                  pymysql.connect(host="127.0.0.1", port=3306, user="ecom",
                                  password="ecom_password", database="ecommerce",
                                  connect_timeout=3).close()
                  print(f"MySQL ready after {attempt} attempt(s)")
                  sys.exit(0)
              except Exception as exc:
                  print(f"attempt {attempt}: {exc}")
                  time.sleep(3)
          sys.exit("MySQL did not become reachable in time")
          PY

      # backend/.env is gitignored, so synthesize a CI one. ENVIRONMENT must NOT
      # be "production" (the mock payment webhook several tests use is hard-
      # disabled there); "ci" is one of the environments conftest.py allows.
      - name: Write CI backend/.env
        run: |
          cat > .env <<'EOF'
          ENVIRONMENT=ci
          DEBUG=true
          SECRET_KEY=ci-only-not-a-real-secret-rotate-me-0123456789abcdef
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=7
          MYSQL_HOST=127.0.0.1
          MYSQL_PORT=3306
          MYSQL_USER=ecom
          MYSQL_PASSWORD=ecom_password
          MYSQL_DB=ecommerce
          REDIS_URL=redis://127.0.0.1:6379/0
          CORS_ORIGINS=["http://localhost:5173"]
          EMAIL_BACKEND=console
          STORAGE_BACKEND=local
          FRONTEND_URL=http://localhost:5173
          PAYMENT_RETURN_URL=http://localhost:5173/payments/return
          EOF

      # Safe here (and ONLY here): this MySQL is an empty throwaway container.
      # The migrations also seed the 26 payment_methods rows + COD/system
      # settings that the suite relies on.
      - name: Apply migrations
        run: alembic upgrade head

      # Run the FULL suite rather than a hand-maintained file list, so newly
      # added tests are picked up automatically.
      - name: Run test suite
        run: python -m pytest tests/ -v

  # ===========================================================================
  #  DELIVERY 1 — build both images and push them to GHCR.
  #
  #  Gated on BOTH quality jobs. The `if:` is belt-and-braces: the workflow only
  #  triggers on `production` anyway, but a `workflow_dispatch` can be launched
  #  from any branch in the Actions UI, and that must never reach the live host.
  # ===========================================================================
  build-and-push:
    name: Build & push images to GHCR
    needs: [frontend, backend-tests]
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      frontend_image: ${{ steps.images.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      # GHCR repository paths must be lowercase; the GitHub owner name is not
      # guaranteed to be, so normalise it once and reuse.
      - name: Resolve image names
        id: images
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "backend=ghcr.io/$owner/simple-com-backend"   >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$owner/simple-com-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both images are tagged twice: :latest (what a bare `docker compose up`
      # on the host pulls) and :<sha> (so every deploy is reproducible and
      # rollback is just IMAGE_TAG=<old-sha>).
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.images.outputs.backend }}:latest
            ${{ steps.images.outputs.backend }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.images.outputs.frontend }}:latest
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}

  # ===========================================================================
  #  DELIVERY 2 — ship the compose file to the EC2 and restart the stack.
  # ===========================================================================
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep the host's compose file in sync with the commit we just built.
      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: ${{ secrets.EC2_APP_DIR }}

      - name: Pull new images and restart the containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_PAT,APP_DIR
          script: |
            set -euo pipefail
            cd "$APP_DIR"

            # Authenticate so the private GHCR packages can be pulled.
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Leftover from the old multi-file layout; this repo now ships a
            # single docker-compose.yml. Harmless if already gone.
            rm -f docker-compose.deploy.yml

            # Pin the deployed commit in the compose project's .env so that the
            # tag survives the SSH session: a later bare `docker compose up -d`
            # or `ps` on the host resolves the SAME images this deploy shipped,
            # instead of drifting back to :latest. (This root .env is only used
            # for compose variable interpolation — it is NOT injected into any
            # container; per-service config still comes from backend/.env.)
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" > .env

            # Fetch the newly built backend + frontend images.
            docker compose pull

            # Recreate the containers. Because IMAGE_TAG changed, the backend and
            # frontend image references differ from what is running, so compose
            # tears those two down and starts them on the new code. redis is
            # untouched (same image) so the cache and its volume survive.
            docker compose up -d --remove-orphans

            # Reclaim disk from the superseded image layers on this shared host.
            docker image prune -f
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}

      # Fail the deploy loudly if the containers did NOT come back on the new
      # code — otherwise a silently-skipped recreate looks like a green deploy.
      - name: Verify the new code is live
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,APP_DIR
          script: |
            set -euo pipefail
            cd "$APP_DIR"

            docker compose ps

            # Every app container must report the exact SHA we just built.
            for svc in backend frontend; do
              cid="$(docker compose ps -q "$svc" || true)"
              if [ -z "$cid" ]; then
                echo "FAIL: service '$svc' is not running"; exit 1
              fi
              image="$(docker inspect -f '{{.Config.Image}}' "$cid")"
              echo "$svc -> $image"
              case "$image" in
                *":$IMAGE_TAG") ;;
                *) echo "FAIL: '$svc' is on $image, expected tag :$IMAGE_TAG"; exit 1 ;;
              esac
            done

            # And the site must actually answer through the published port.
            for i in $(seq 1 12); do
              if curl -fsS -o /dev/null http://localhost:8090/; then
                echo "Storefront is serving on :8090"; exit 0
              fi
              echo "waiting for the storefront ($i)…"; sleep 5
            done
            echo "FAIL: storefront did not answer on :8090"
            docker compose logs --tail 50 frontend backend
            exit 1
        env:
          IMAGE_TAG: ${{ github.sha }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
