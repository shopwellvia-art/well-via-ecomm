# =============================================================================
#  CI/CD — the ONLY workflow in this repo.
# =============================================================================
#
#  PRODUCTION BRANCH ONLY. Nothing here runs for any other branch or for Pull
#  Requests — a push (or a merge, which is just a push) to `production` runs the
#  whole thing end to end and the live EC2 stack comes back up on the new code.
#
#      push / merge to `production`
#         └─ frontend        (npm ci, lint, build — NO unit tests)
#                    │
#                    ▼  must be green
#              build-and-push (GHCR: :latest + :<sha>, FULL no-cache rebuild)
#                    │
#                    ▼
#                 deploy     (scp compose -> EC2, pull, force-recreate
#                             backend+frontend, delete the superseded images,
#                             then verify both really run the new :<sha>)
#
#  NO TEST SUITES RUN HERE. Vitest and the pytest/MySQL integration job were
#  removed deliberately — `npm run build` is the only pre-flight gate, and the
#  Docker builds themselves are the second gate (a broken install/compile fails
#  build-and-push). Run pytest locally before merging to `production`.
#
#  IMAGES ARE REBUILT FROM SCRATCH every run: `no-cache: true` + `pull: true`,
#  and no GHA layer cache. Slower (~6-10 min) but guarantees a fresh `npm ci` /
#  `pip install` and a current base image on every deploy.
#
#  Schema migrations are NEVER run by this pipeline; the shared remote MySQL is
#  on a migration lineage this repo does not contain. See DEPLOY.md §6.
# =============================================================================

name: CI/CD

on:
  push:
    branches: [production]
  workflow_dispatch:

# One deploy at a time. cancel-in-progress is deliberately FALSE: killing a run
# midway through `docker compose up -d` could leave the live stack half-updated,
# so back-to-back merges queue and apply in order instead of racing.
concurrency:
  group: cicd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ===========================================================================
  #  QUALITY GATE — the React/Vite app must install, lint and BUILD.
  #
  #  This is a cheap pre-flight only: it fails a broken frontend in ~2 min
  #  instead of ~8 min into the no-cache Docker build. Unit tests (Vitest) are
  #  intentionally NOT run here.
  # ===========================================================================
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The real gate: if it doesn't build, nothing ships.
      - name: Build
        run: npm run build

  # ===========================================================================
  #  DELIVERY 1 — build both images FROM SCRATCH and push them to GHCR.
  #
  #  Gated on the frontend build. The `if:` is belt-and-braces: the workflow only
  #  triggers on `production` anyway, but a `workflow_dispatch` can be launched
  #  from any branch in the Actions UI, and that must never reach the live host.
  # ===========================================================================
  build-and-push:
    name: Build & push images to GHCR (no cache)
    needs: [frontend]
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      frontend_image: ${{ steps.images.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      # GHCR repository paths must be lowercase; the GitHub owner name is not
      # guaranteed to be, so normalise it once and reuse.
      - name: Resolve image names
        id: images
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "backend=ghcr.io/$owner/simple-com-backend"   >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$owner/simple-com-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build provenance stamped into both images (OCI labels + /version). The
      # deploy's verify step reads it back off the LIVE host, so a stale or
      # skipped recreate can no longer masquerade as a green deploy.
      - name: Compute build metadata
        id: meta
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # Both images are tagged twice: :latest (what a bare `docker compose up`
      # on the host pulls) and :<sha> (so every deploy is reproducible and
      # rollback is just IMAGE_TAG=<old-sha>).
      #
      # FULL REBUILD, deliberately:
      #   no-cache: true -> every layer re-executes; `pip install` / `npm ci`
      #                     really re-resolve instead of restoring a cached layer.
      #   pull: true     -> re-pull the FROM base image so a patched
      #                     python/node/nginx base is actually picked up.
      #   No cache-from/cache-to: there is no GHA layer cache to fall back on.
      # Costs ~6-10 min per run. Delete these two flags (and restore
      # cache-from/cache-to: type=gha) if that ever becomes too slow.
      - name: Build & push backend (clean rebuild)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          no-cache: true
          pull: true
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          tags: |
            ${{ steps.images.outputs.backend }}:latest
            ${{ steps.images.outputs.backend }}:${{ github.sha }}

      - name: Build & push frontend (clean rebuild)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          no-cache: true
          pull: true
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          tags: |
            ${{ steps.images.outputs.frontend }}:latest
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}

  # ===========================================================================
  #  DELIVERY 2 — ship the compose file to the EC2 and restart the stack.
  # ===========================================================================
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep the host's compose file in sync with the commit we just built.
      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: ${{ secrets.EC2_APP_DIR }}

      - name: Pull new images, recreate containers, delete the old images
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_PAT,APP_DIR
          script: |
            set -euo pipefail
            cd "$APP_DIR"

            # Authenticate so the private GHCR packages can be pulled. Both
            # packages are Private, so this is NOT optional — without it the
            # `docker compose pull` below dies with "denied: denied".
            #
            # GHCR_USER must be the GitHub *user account* that owns GHCR_PAT,
            # NOT the org (`shopwellvia-art`) — an org name cannot log in.
            if [ -z "${GHCR_USER:-}" ] || [ -z "${GHCR_PAT:-}" ]; then
              echo "FAIL: GHCR_USER and/or GHCR_PAT repo secret is empty."
              echo "  GHCR_USER = your GitHub username (e.g. 9741Prajwalj)"
              echo "  GHCR_PAT  = classic PAT with read:packages"
              exit 1
            fi
            if ! echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; then
              echo "FAIL: GHCR rejected the login for user '$GHCR_USER'."
              echo "  'denied'      -> PAT is missing the read:packages scope,"
              echo "                   is a fine-grained PAT, or was never"
              echo "                   SSO-authorised for the shopwellvia-art org."
              echo "  'unauthorized'-> PAT is wrong or expired. Regenerate it."
              exit 1
            fi

            # Leftover from the old multi-file layout; this repo now ships a
            # single docker-compose.yml. Harmless if already gone.
            rm -f docker-compose.deploy.yml

            # Pin the deployed commit in the compose project's .env so that the
            # tag survives the SSH session: a later bare `docker compose up -d`
            # or `ps` on the host resolves the SAME images this deploy shipped,
            # instead of drifting back to :latest. (This root .env is only used
            # for compose variable interpolation — it is NOT injected into any
            # container; per-service config still comes from backend/.env.)
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" > .env

            # Record which images the CURRENTLY running app containers are on,
            # so we can delete exactly those once the new ones are live. Taken
            # BEFORE the pull — afterwards the old :latest tag is gone.
            old_images=""
            for svc in backend frontend; do
              cid="$(docker compose ps -q "$svc" 2>/dev/null || true)"
              if [ -n "$cid" ]; then
                old_images="$old_images $(docker inspect -f '{{.Image}}' "$cid")"
              fi
            done
            echo "currently running image ids:$old_images"

            # Fetch the freshly built backend + frontend images. Scoped to those
            # two services on purpose: redis must not be re-pulled or restarted,
            # because carts, refresh-token sessions and OTPs live in it.
            docker compose pull backend frontend

            # Recreate the two app containers unconditionally. --force-recreate
            # means we do NOT depend on the image reference having changed to
            # trigger a restart — the containers are destroyed and rebuilt from
            # the new images every single deploy. redis is not named here, so it
            # keeps running and its volume is never touched.
            docker compose up -d --force-recreate --remove-orphans backend frontend

            # Now delete the superseded images. Only runs after the new
            # containers are up, and Docker refuses to remove an image that a
            # running container uses — so this can never pull the live stack out
            # from under itself.
            for img in $old_images; do
              docker rmi -f "$img" 2>/dev/null || echo "keeping $img (still in use)"
            done

            # Sweep everything else unreferenced: dangling layers plus any older
            # :<sha> tags from previous deploys. -a is safe for the same reason
            # as above — images backing a RUNNING container are never removed,
            # so redis:7-alpine and the two new app images survive.
            docker image prune -af
            docker builder prune -af 2>/dev/null || true

            echo "images remaining on host:"
            docker images
        env:
          IMAGE_TAG: ${{ github.sha }}
          # NOT github.repository_owner — that resolves to the ORG name
          # (shopwellvia-art), which GHCR will not accept as a login user.
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}

      # Fail the deploy loudly if the containers did NOT come back on the new
      # code — otherwise a silently-skipped recreate looks like a green deploy.
      - name: Verify the new code is live
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,APP_DIR
          script: |
            set -euo pipefail
            cd "$APP_DIR"

            docker compose ps

            # Every app container must report the exact SHA we just built.
            for svc in backend frontend; do
              cid="$(docker compose ps -q "$svc" || true)"
              if [ -z "$cid" ]; then
                echo "FAIL: service '$svc' is not running"; exit 1
              fi
              image="$(docker inspect -f '{{.Config.Image}}' "$cid")"
              echo "$svc -> $image"
              case "$image" in
                *":$IMAGE_TAG") ;;
                *) echo "FAIL: '$svc' is on $image, expected tag :$IMAGE_TAG"; exit 1 ;;
              esac
            done

            # The site must actually answer through the published port.
            ok=""
            for i in $(seq 1 12); do
              if curl -fsS -o /dev/null http://localhost:8090/; then
                ok=1; echo "Storefront is serving on :8090"; break
              fi
              echo "waiting for the storefront ($i)…"; sleep 5
            done
            if [ -z "$ok" ]; then
              echo "FAIL: storefront did not answer on :8090"
              docker compose logs --tail 50 frontend backend
              exit 1
            fi

            # HTTP-level proof the LIVE frontend really is the commit we just
            # built. The image-tag check above catches a skipped recreate; this
            # catches a stale/cached bundle actually being served to browsers.
            ver="$(curl -fsS http://localhost:8090/version.json || true)"
            echo "frontend /version.json -> $ver"
            case "$ver" in
              *"$IMAGE_TAG"*) echo "frontend build stamp matches $IMAGE_TAG" ;;
              *) echo "FAIL: /version.json did not report $IMAGE_TAG"; exit 1 ;;
            esac

            # Backend build stamp (proxied) — confirms /version is wired end to end.
            echo "backend  /version      -> $(curl -fsS http://localhost:8090/version || echo unreachable)"
        env:
          IMAGE_TAG: ${{ github.sha }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
