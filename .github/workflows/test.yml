name: Backend tests

# Runs the payment integration suite against a real MySQL + Redis stack.
# These are integration tests (live DB via SessionLocal + FastAPI TestClient),
# so we bring the compose stack up rather than running pytest bare.
on:
  push:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payment-tests:
    name: Payment integration tests
    runs-on: ubuntu-latest
    # The mysql service lives in the CI-only overlay (docker-compose.ci.yml); the
    # base compose file has no DB (production uses an external remote MySQL).
    # COMPOSE_FILE makes every `docker compose` step below apply both files, so
    # we don't have to repeat -f flags. The ":" separator is the Linux default.
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      # backend/.env is gitignored; synthesize a CI one. ENVIRONMENT must NOT be
      # "production" or the mock webhook (used by several tests) is hard-disabled;
      # "ci" is one of the environments the tests/conftest.py DB guard allows.
      - name: Create backend/.env for CI
        run: |
          cat > backend/.env <<'EOF'
          ENVIRONMENT=ci
          DEBUG=true
          SECRET_KEY=ci-only-not-a-real-secret-rotate-me-0123456789abcdef
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=7
          MYSQL_HOST=mysql
          MYSQL_PORT=3306
          MYSQL_USER=ecom
          MYSQL_PASSWORD=ecom_password
          MYSQL_DB=ecommerce
          REDIS_URL=redis://redis:6379/0
          CORS_ORIGINS=["http://localhost:5173"]
          EMAIL_BACKEND=console
          STORAGE_BACKEND=local
          FRONTEND_URL=http://localhost:5173
          PAYMENT_RETURN_URL=http://localhost:5173/payments/return
          EOF

      - name: Start mysql, redis, backend
        run: docker compose up -d --build mysql redis backend

      - name: Wait for MySQL to be healthy
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q mysql)" 2>/dev/null || echo starting)"
            if [ "$status" = "healthy" ]; then echo "MySQL healthy"; exit 0; fi
            echo "waiting for mysql ($i): $status"; sleep 5
          done
          echo "MySQL did not become healthy in time"; docker compose logs mysql; exit 1

      # Migrations seed the 26 payment_methods rows + COD/system settings the
      # tests rely on. Retry briefly in case the backend container is still
      # finishing its first boot.
      - name: Apply migrations
        run: |
          for i in $(seq 1 6); do
            if docker compose exec -T backend alembic upgrade head; then exit 0; fi
            echo "migration attempt $i failed, retrying…"; sleep 5
          done
          echo "alembic upgrade head failed"; docker compose logs backend; exit 1

      # pytest is a dev/CI-only tool — it's intentionally absent from the
      # production image (requirements.txt). Install the test deps into the
      # already-built container as root (the image runs as the unprivileged
      # `app` user whose ~/.local is root-owned, so a --user install would fail;
      # a plain root install lands in the shared /usr/local site-packages).
      - name: Install test dependencies
        run: docker compose exec -T -u root backend pip install --no-cache-dir -r requirements-dev.txt

      # Run the FULL suite rather than a hand-maintained file list, so newly
      # added tests are picked up automatically. tests/conftest.py hard-fails the
      # run unless it's pointed at a throwaway local DB (ENVIRONMENT=ci +
      # MYSQL_HOST=mysql above), so this can never touch the shared remote MySQL.
      - name: Run test suite
        run: docker compose exec -T backend python -m pytest tests/ -v

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs backend

      - name: Tear down
        if: always()
        run: docker compose down -v
