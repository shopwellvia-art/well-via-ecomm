# =============================================================================
#  CI  =  "Continuous Integration"
#
#  WHAT IS THIS FILE?
#  ------------------
#  This is a GitHub Actions "workflow". It is just a recipe written in YAML that
#  GitHub runs FOR you on GitHub's own computers (called "runners") every time
#  something happens in your repo (for example: you push code).
#
#  WHY DO WE WANT IT?
#  ------------------
#  So that a robot checks your code automatically. Before, you had to remember to
#  run `npm run build` yourself. Now, every push, GitHub builds the app and tells
#  you (green tick ✅ or red cross ❌) whether it still works. This catches
#  mistakes early — before they reach other people or the live server.
#
#  WHERE DOES IT LIVE?
#  -------------------
#  Any file inside `.github/workflows/*.yml` is picked up by GitHub automatically.
#  You already have two other workflows in this folder:
#     - test.yml   -> runs the heavy backend integration tests (real DB + Redis)
#     - deploy.yml -> builds Docker images and deploys to the EC2 server (CD)
#  THIS file is a light, fast "does it still build?" check.
#
#  HOW TO READ A WORKFLOW (the 4 big words):
#     workflow -> the whole file (one recipe)
#       job    -> a group of steps that runs on one fresh machine
#       step   -> a single instruction (either an "action" or a shell command)
#       action -> a reusable pre-made step someone else wrote (e.g. checkout)
# =============================================================================

# The name you will see in the GitHub "Actions" tab.
name: CI

# -----------------------------------------------------------------------------
# 1) "on:"  ->  WHEN should this workflow run? (the trigger)
# -----------------------------------------------------------------------------
on:
  # Run whenever code is pushed to these branches.
  push:
    branches: [vinay, main, production]
  # Also run for every Pull Request, so you see the tick BEFORE merging.
  pull_request:
  # And give us a manual "Run workflow" button in the Actions tab.
  workflow_dispatch:

# -----------------------------------------------------------------------------
# 2) "concurrency:"  ->  don't waste minutes running old commits.
#     If you push twice quickly, cancel the first (still-running) job and keep
#     only the newest one. `github.ref` = the branch, so each branch is separate.
# -----------------------------------------------------------------------------
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# -----------------------------------------------------------------------------
# 3) "jobs:"  ->  the actual work. Jobs run in PARALLEL by default, each on its
#     own brand-new Ubuntu machine (so they never affect each other).
# -----------------------------------------------------------------------------
jobs:

  # ===========================================================================
  #  JOB A: FRONTEND — install dependencies and build the React/Vite app.
  # ===========================================================================
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest          # the type of machine GitHub gives us

    defaults:
      run:
        # Our frontend code lives in the `frontend/` sub-folder, so run every
        # shell command from there (saves writing `cd frontend` each time).
        working-directory: frontend

    steps:
      # STEP 1: copy your repository onto the runner. Without this, the machine
      # is empty. `uses:` means "run a ready-made action from the marketplace".
      - name: Checkout the code
        uses: actions/checkout@v4

      # STEP 2: install Node.js. `with:` passes settings to the action.
      #  - node-version: which Node to use (20 is a stable LTS version).
      #  - cache: npm    -> save the downloaded packages between runs = faster.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # STEP 3: install exactly the versions locked in package-lock.json.
      # `npm ci` (Clean Install) is the CI-friendly cousin of `npm install`:
      # it is faster and reproducible because it never changes the lockfile.
      - name: Install dependencies
        run: npm ci

      # STEP 4: THE REAL GATE. If the app cannot build, this step fails, the job
      # goes red ❌, and you get an email. This is the check that truly matters.
      - name: Build the app
        run: npm run build

      # STEP 5 (optional, learning): lint = check code style / common mistakes.
      # `continue-on-error: true` means: try it, but DON'T fail the whole job if
      # it errors. We keep it non-blocking because ESLint here still needs a v9
      # "eslint.config.js" flat-config file. Once you add that config, delete the
      # `continue-on-error` line to make lint a required, blocking check.
      - name: Lint (non-blocking for now)
        run: npm run lint
        continue-on-error: true

      # STEP 6 (optional, learning): run unit tests with Vitest.
      #  --run              -> run once and exit (don't stay in watch mode).
      #  --passWithNoTests  -> succeed even though there are 0 test files yet.
      # When you start writing tests, remove --passWithNoTests so missing/failing
      # tests correctly turn the job red.
      - name: Unit tests (Vitest)
        run: npm test -- --run --passWithNoTests

  # ===========================================================================
  #  JOB B: BACKEND — a quick "does the Python even compile?" sanity check.
  #
  #  NOTE: your REAL backend tests (with a live MySQL + Redis) already run in
  #  test.yml. We do NOT repeat those here — this is just a fast syntax gate so
  #  an obvious Python typo is caught in seconds without spinning up a database.
  # ===========================================================================
  backend:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      # Install Python (3.12 matches the version inside your backend container).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `compileall` byte-compiles every .py file. It does NOT run your app or
      # need any database — it simply fails if any file has a syntax error.
      - name: Compile-check all backend Python files
        run: python -m compileall backend/app
