upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Hide nginx version from response headers.
    server_tokens off;

    # Security response headers — applied to every response from this server block.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
    # HSTS — uncomment once TLS terminates at this nginx (do NOT enable on plain HTTP):
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location /media/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        # Harden user-upload responses: prevent stored HTML/SVG from executing
        # as same-origin script.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Content-Disposition "inline" always;
    }

    location /docs {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend_upstream;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
    }
}
